<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bobby Stage</title>
<style>
:root {
  --bg: #f4f2ee; --panel: #ffffff; --ink: #1b1d22; --muted: #6b6f78; --line: #e2dfd8;
  --accent: #2f6df6; --accent-soft: #e4ecff; --ok: #1f9d55; --ok-soft: #dcf3e5;
  --bad: #d64545; --bad-soft: #fbe3e3; --warn: #c98a00; --you: #efece6; --bobby: #e4ecff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --panel: #171a21; --ink: #eef0f4; --muted: #9298a5; --line: #262b35;
    --accent: #6d9bff; --accent-soft: #1b2742; --ok: #3ccf7f; --ok-soft: #133324;
    --bad: #ff6b6b; --bad-soft: #3a1a1c; --warn: #f2b84b; --you: #222630; --bobby: #1b2742;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #171a21; --ink: #eef0f4; --muted: #9298a5; --line: #262b35;
  --accent: #6d9bff; --accent-soft: #1b2742; --ok: #3ccf7f; --ok-soft: #133324;
  --bad: #ff6b6b; --bad-soft: #3a1a1c; --warn: #f2b84b; --you: #222630; --bobby: #1b2742;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: grid; grid-template-rows: auto 1fr; gap: 16px; padding: 16px 20px;
}
header { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.brand { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
.brand span { color: var(--accent); }
#task { flex: 1; min-width: 240px; display: flex; align-items: baseline; gap: 14px; }
#task-title { font-size: 28px; font-weight: 700; }
.badge { font-size: 15px; font-weight: 700; padding: 3px 12px; border-radius: 999px;
  text-transform: uppercase; letter-spacing: 0.06em; background: var(--line); color: var(--muted); }
.badge.started { background: var(--accent-soft); color: var(--accent); }
.badge.done { background: var(--ok-soft); color: var(--ok); }
.badge.failed, .badge.cancelled { background: var(--bad-soft); color: var(--bad); }
#peers { display: flex; gap: 14px; font-size: 16px; color: var(--muted); }
.peer { display: flex; align-items: center; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.peer.on .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.peer.on { color: var(--ink); }
#conn { font-size: 14px; color: var(--muted); }
#conn.live { color: var(--ok); }
#conn.down { color: var(--bad); }

main { display: grid; gap: 16px; min-height: 0;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 1fr);
  grid-template-areas: "talk plan feed"; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px 18px; display: flex; flex-direction: column; min-height: 0; }
.panel h2 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.scroll { overflow-y: auto; min-height: 0; flex: 1; }
#talk-panel { grid-area: talk; }
#plan-panel { grid-area: plan; }
#side { grid-area: feed; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
#feed-panel { flex: 1; }
.empty { color: var(--muted); font-style: italic; }

/* Conversation */
#talk { display: flex; flex-direction: column; gap: 10px; }
.line { max-width: 92%; padding: 10px 14px; border-radius: 14px; font-size: 20px; animation: pop .25s ease-out; }
.line .who { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.line.you { align-self: flex-end; background: var(--you); border-bottom-right-radius: 4px; }
.line.bobby { align-self: flex-start; background: var(--bobby); border-bottom-left-radius: 4px; }
.line.sys { align-self: center; background: none; padding: 2px; font-size: 14px; color: var(--muted); }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Plan */
#plan ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.step { display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: start;
  padding: 14px 16px; border-radius: 12px; border: 2px solid transparent; transition: background .3s, border-color .3s, opacity .3s; }
.step .mark { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 800; font-size: 18px; background: var(--line); color: var(--muted); }
.step .do { font-size: 26px; font-weight: 700; line-height: 1.2; }
.step .why { font-size: 18px; color: var(--muted); margin-top: 2px; }
.step .why::before { content: "why: "; font-weight: 700; }
.step.running { background: var(--accent-soft); border-color: var(--accent); }
.step.running .mark { background: var(--accent); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
.step.done { opacity: .62; }
.step.done .mark { background: var(--ok); color: #fff; }
.step.failed .mark { background: var(--bad); color: #fff; }
.step.changed { box-shadow: 0 0 0 3px var(--warn); }
.plan-note { font-size: 15px; color: var(--warn); font-weight: 700; margin: 0 0 8px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px transparent; transform: scale(1.08); } }

/* Phone feed */
#feed { display: flex; flex-direction: column; gap: 8px; }
.act { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: baseline; font-size: 20px; animation: pop .25s ease-out; }
.act .res { font-weight: 800; text-align: center; color: var(--muted); }
.act.ok .res { color: var(--ok); }
.act.fail .res { color: var(--bad); }
.act.fail .what::after { content: attr(data-err); display: block; font-size: 14px; color: var(--bad); }
.act.pending .what { font-weight: 700; }
.act.note { font-size: 16px; color: var(--muted); }
.act.note .res { color: var(--warn); }

/* Call */
#call-panel { border-color: var(--accent); }
#call .status { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
#call .status.live::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--bad); animation: blink 1s infinite; }
#call .number { color: var(--muted); font-size: 15px; margin-top: 2px; }
#call .summary { font-size: 22px; margin-top: 10px; padding: 10px 12px; background: var(--ok-soft); border-radius: 10px; }
#call .summary.failed { background: var(--bad-soft); }
#call .tx { margin-top: 10px; font-size: 15px; color: var(--muted); display: grid; gap: 4px; max-height: 9em; overflow-y: auto; }
#call .tx b { color: var(--ink); }
@keyframes blink { 50% { opacity: .25; } }

@media (max-width: 900px) {
  body { padding: 12px 16px; height: auto; }
  html, body { height: auto; }
  main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "plan" "talk" "feed"; }
  .scroll { max-height: 60vh; }
  .brand { font-size: 26px; } #task-title { font-size: 22px; }
  .step { grid-template-columns: 34px 1fr; padding: 10px 12px; } .step .mark { width: 32px; height: 32px; font-size: 15px; }
  .step .do { font-size: 20px; } .step .why, .line, .act { font-size: 16px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">Bobby<span>.</span></div>
  <div id="task"><span id="task-title" class="empty">Waiting for a task</span><span id="task-status"></span></div>
  <div id="peers"></div>
  <div id="conn">connecting…</div>
</header>
<main>
  <section class="panel" id="talk-panel"><h2>Conversation</h2><div class="scroll" id="talk"><p class="empty">Nothing said yet</p></div></section>
  <section class="panel" id="plan-panel"><h2>Plan</h2><div class="scroll" id="plan"><p class="empty">No plan yet</p></div></section>
  <div id="side">
    <section class="panel" id="call-panel" hidden><h2>Phone call</h2><div id="call"></div></section>
    <section class="panel" id="feed-panel"><h2>Phone</h2><div class="scroll" id="feed"><p class="empty">No actions yet</p></div></section>
  </div>
</main>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const hub = (params.get("hub") || "ws://localhost:8765").replace(/\/+$/, "");
const hubUrl = (/^wss?:\/\//.test(hub) ? hub : "ws://" + hub) + "/watch?token=" + encodeURIComponent(params.get("token") || "");
if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");

const $ = (id) => document.getElementById(id);
const handlers = {};            // type -> fn(msg), filled in below
function handle(msg) {
  const fn = handlers[msg.type];
  if (fn) { try { fn(msg); } catch (e) { console.error("handler", msg.type, e); } }
}

// Connection: hello, then every frame goes to handle(). Reconnect 1 s, 2 s, 5 s, then every 5 s.
const backoff = [1000, 2000, 5000];
let tries = 0;
function setConn(text, cls) { const el = $("conn"); el.textContent = text; el.className = cls || ""; }
function connect() {
  setConn("connecting…");
  let ws;
  try { ws = new WebSocket(hubUrl); } catch (e) { return retry(); }
  ws.onopen = () => ws.send(JSON.stringify({ type: "hello", role: "watch", v: 1 }));
  ws.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === "welcome") { tries = 0; setConn("live", "live"); return; }
    handle(msg);
  };
  ws.onclose = (e) => {
    if (e.code === 4003) setConn("wrong token", "down");
    retry();
  };
}
function retry() {
  const wait = backoff[Math.min(tries++, backoff.length - 1)];
  if ($("conn").textContent !== "wrong token") setConn("reconnecting in " + wait / 1000 + " s", "down");
  setTimeout(connect, wait);
}
// ---------- helpers ----------
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function clearEmpty(box) { box.querySelectorAll(":scope > .empty").forEach((e) => e.remove()); }
function stickToBottom(box, add) {
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  add();
  if (atBottom) box.scrollTop = box.scrollHeight;
}

// ---------- conversation ----------
function addLine(kind, who, text) {
  const box = $("talk");
  clearEmpty(box);
  stickToBottom(box, () => {
    const line = el("div", "line " + kind);
    if (who) line.append(el("span", "who", who));
    line.append(document.createTextNode(text));
    box.append(line);
    while (box.children.length > 60) box.firstChild.remove();
  });
}

// ---------- task + plan ----------
let plan = { task: null, steps: [], status: {} };   // status: n -> running|done|failed
function setTask(m) {
  const t = $("task-title");
  t.textContent = m.title || m.task;
  t.className = "";
  const b = $("task-status");
  b.textContent = m.status;
  b.className = "badge " + m.status;
}
function renderPlan(changed = new Set(), note = "") {
  const box = $("plan");
  box.textContent = "";
  if (!plan.steps.length) { box.append(el("p", "empty", "No plan yet")); return; }
  if (note) box.append(el("p", "plan-note", note));
  const ol = el("ol");
  for (const s of plan.steps) {
    const st = plan.status[s.n] || "pending";
    const li = el("li", "step " + st + (changed.has(s.n) ? " changed" : ""));
    li.dataset.n = s.n;
    li.append(el("div", "mark", st === "done" ? "✓" : st === "failed" ? "✕" : String(s.n)));
    const body = el("div");
    body.append(el("div", "do", s.do));
    if (s.why) body.append(el("div", "why", s.why));
    li.append(body);
    ol.append(li);
  }
  box.append(ol);
  const running = box.querySelector(".step.running");
  if (running) running.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

handlers.task = (m) => {
  setTask(m);
  if (m.status === "started" && m.task !== plan.task) { plan = { task: m.task, steps: [], status: {} }; renderPlan(); }
};
handlers.plan = (m) => {
  const steps = m.steps || [];
  let changed = new Set(), note = "";
  if (m.task === plan.task && plan.steps.length) {
    const old = new Map(plan.steps.map((s) => [s.n, s.do + "|" + s.why]));
    for (const s of steps) if (old.get(s.n) !== s.do + "|" + s.why) changed.add(s.n);
    if (changed.size) note = "Plan changed";
  } else if (m.task !== plan.task) {
    plan = { task: m.task, steps: [], status: {} };
  }
  plan.steps = steps;
  renderPlan(changed, note);
};
handlers.step = (m) => {
  if (m.task !== plan.task) return;
  plan.status[m.n] = m.status;
  renderPlan();
};

// ---------- wire: frames between the parts ----------
const wire = {};   // msg.type -> fn(msg, frame)
handlers.wire = (f) => {
  const m = f.msg || {};
  const fn = wire[m.type];
  if (fn) { try { fn(m, f); } catch (e) { console.error("wire", m.type, e); } }
};
wire.heard = (m) => addLine("you", "You", m.text);
wire.spoke = (m) => addLine("bobby", "Bobby", m.text);
wire.wake = () => addLine("sys", "", "Bobby is listening");
wire.asleep = () => addLine("sys", "", "Bobby went to sleep");

// ---------- peers ----------
const PEERS = [["hands", "Hands"], ["mind", "Mind"], ["mouth", "Mouth"], ["caller", "Caller"]];
handlers.peers = (m) => {
  const box = $("peers");
  box.textContent = "";
  for (const [key, label] of PEERS) {
    const p = el("div", "peer" + (m[key] ? " on" : ""));
    p.title = label + (m[key] ? " connected" : " not connected");
    p.append(el("span", "dot"), document.createTextNode(label));
    box.append(p);
  }
};

// ---------- phone feed ----------
function targetWords(on) {
  if (!on) return "";
  if (on.text != null) return "“" + on.text + "”";
  if (on.n != null) return "item " + on.n;
  if (on.x != null) return "(" + on.x + ", " + on.y + ")";
  return "";
}
function actWords(m) {
  const t = targetWords(m.on);
  switch (m.do) {
    case "tap": return "Tap " + t;
    case "long_press": return "Long-press " + t;
    case "point": return "Point at " + t;
    case "type": return "Type “" + (m.text || "") + "”";
    case "swipe": return "Swipe " + (m.dir || "") + (t ? " on " + t : "");
    case "key": return { home: "Go home", back: "Go back", recents: "Open recent apps",
      notifications: "Open notifications", enter: "Press Enter" }[m.name] || "Press " + m.name;
    case "launch": return "Open " + (m.app || "app");
    case "wait": return "Wait " + ((m.ms || 0) / 1000) + " s";
    default: return m.do || "Action";
  }
}
const acts = new Map();   // act id -> feed row
function addFeed(row) {
  const box = $("feed");
  clearEmpty(box);
  stickToBottom(box, () => {
    box.append(row);
    while (box.children.length > 80) box.firstChild.remove();
  });
}
function feedRow(cls, mark, text) {
  const row = el("div", "act " + cls);
  row.append(el("span", "res", mark), el("span", "what", text));
  return row;
}
wire.act = (m) => {
  const row = feedRow("pending", "…", actWords(m));
  acts.set(m.id, row);
  addFeed(row);
};
wire.act_result = (m) => {
  const row = acts.get(m.re);
  if (!row) return;
  acts.delete(m.re);
  row.className = "act " + (m.ok ? "ok" : "fail");
  row.querySelector(".res").textContent = m.ok ? "✓" : "✕";
  if (!m.ok) row.querySelector(".what").dataset.err = m.error || "failed";
};
wire.screen = () => addFeed(feedRow("note", "◎", "Reading the screen"));
wire.notification = (m) => addFeed(feedRow("note", "🔔", (m.title ? m.title + ": " : "") + (m.text || "")));

// ---------- call ----------
const CALL_WORDS = { dialing: "Dialing…", answered: "On the call", ended: "Call ended", failed: "Call failed" };
let callNumber = "";
function callPanel() { $("call-panel").hidden = false; return $("call"); }
wire.call = (m) => {
  callNumber = m.number || "";
  const box = callPanel();
  box.textContent = "";
  box.append(el("div", "status", "Starting call…"), el("div", "number", callNumber));
  if (m.goal) box.append(el("div", "number", "Goal: " + m.goal));
};
wire.call_status = (m) => {
  const box = callPanel();
  let s = box.querySelector(".status");
  if (!s) { s = el("div", "status"); box.prepend(s); }
  s.textContent = CALL_WORDS[m.status] || m.status;
  s.className = "status" + (m.status === "dialing" || m.status === "answered" ? " live" : "");
};
wire.call_result = (m) => {
  const box = callPanel();
  box.querySelector(".summary")?.remove();
  box.querySelector(".tx")?.remove();
  const s = box.querySelector(".status") || box.appendChild(el("div", "status"));
  s.className = "status";
  s.textContent = m.ok ? "Call ended" : "Call failed";
  box.append(el("div", "summary" + (m.ok ? "" : " failed"), m.ok ? m.summary : "Didn't get through: " + (m.error || "failed")));
  if (Array.isArray(m.transcript) && m.transcript.length) {
    const tx = el("div", "tx");
    for (const t of m.transcript) {
      const line = el("div");
      line.append(el("b", null, t.who === "me" ? "Bobby: " : "Them: "), document.createTextNode(t.text));
      tx.append(line);
    }
    box.append(tx);
  }
};

connect();
</script>
</body>
</html>
