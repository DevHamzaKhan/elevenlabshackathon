<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Bobby architecture: two surfaces and Exec on the phone, one Orchestrator on the Mac</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5b5780"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cfc8f0; stroke-width: 1.5; }
      .ext { fill: #f7f7fa; stroke: #b9b7c9; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .h { font-size: 17px; font-weight: 700; fill: #1b1640; }
      .s { font-size: 13px; fill: #5b5780; }
      .lbl { font-size: 12px; fill: #5b5780; }
      .wire { stroke: #5b5780; stroke-width: 1.6; fill: none; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; fill: #7c5cff; }
    </style>
  </defs>

  <!-- background so it reads on light and dark pages -->
  <rect x="0" y="0" width="960" height="620" rx="18" fill="#fbfaff"/>
  <rect x="0.75" y="0.75" width="958.5" height="618.5" rx="18" fill="none" stroke="#e3dff5" stroke-width="1.5"/>

  <!-- Phone -->
  <rect x="40" y="56" width="880" height="184" rx="22" fill="#f1eeff" stroke="#c9bfff" stroke-width="1.5"/>
  <text x="64" y="84" class="tag">ANDROID PHONE · ONE APK (dev.bobby.agent)</text>

  <rect x="64" y="104" width="240" height="108" rx="14" class="box"/>
  <text x="84" y="138" class="h">Voice surface</text>
  <text x="84" y="162" class="s">ElevenLabs agent session</text>
  <text x="84" y="182" class="s">earbuds · shortcut · barge-in</text>

  <rect x="328" y="104" width="240" height="108" rx="14" class="box"/>
  <text x="348" y="138" class="h">Chat surface</text>
  <text x="348" y="162" class="s">typed requests · Stop</text>
  <text x="348" y="182" class="s">live plan checklist</text>

  <rect x="656" y="104" width="240" height="108" rx="14" class="box"/>
  <text x="676" y="138" class="h">Exec</text>
  <text x="676" y="162" class="s">accessibility service</text>
  <text x="676" y="182" class="s">reads screen · glides cursor · taps</text>

  <!-- ElevenLabs cloud -->
  <rect x="40" y="330" width="170" height="86" rx="14" class="ext"/>
  <text x="58" y="364" class="h" style="font-size:15px">ElevenLabs</text>
  <text x="58" y="386" class="s">Agents: speech in/out</text>

  <!-- Orchestrator -->
  <rect x="250" y="310" width="460" height="126" rx="18" fill="#7c5cff"/>
  <text x="480" y="348" text-anchor="middle" style="font-size:20px;font-weight:700" fill="#ffffff">Orchestrator · Mac, Python</text>
  <text x="480" y="376" text-anchor="middle" style="font-size:14px" fill="#ece8ff">hub :8765 · triage · planner · task loop</text>
  <text x="480" y="398" text-anchor="middle" style="font-size:14px" fill="#ece8ff">narration · interruptions · memory · app hints</text>

  <!-- OpenAI -->
  <rect x="750" y="330" width="170" height="86" rx="14" class="ext"/>
  <text x="768" y="364" class="h" style="font-size:15px">OpenAI</text>
  <text x="768" y="386" class="s">planner + triage model</text>

  <!-- Dashboard + Caller -->
  <rect x="250" y="506" width="220" height="80" rx="14" class="box"/>
  <text x="268" y="538" class="h" style="font-size:16px">Dashboard (Stage)</text>
  <text x="268" y="562" class="s">role watch · read-only</text>

  <rect x="490" y="506" width="220" height="80" rx="14" class="ext"/>
  <text x="508" y="538" class="h" style="font-size:16px">Caller (stretch)</text>
  <text x="508" y="562" class="s">phone call in your voice</text>

  <!-- wires -->
  <path class="wire" d="M184,212 L330,310" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path class="wire" d="M448,212 L448,310" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path class="wire" d="M776,212 L630,310" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path class="wire" d="M110,212 L110,330" marker-start="url(#ah)" marker-end="url(#ah)" stroke-dasharray="4 4"/>
  <path class="wire" d="M710,373 L750,373" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path class="wire" d="M360,436 L360,506" marker-end="url(#ah)"/>
  <path class="wire" d="M600,436 L600,506" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- wire labels -->
  <rect x="236" y="256" width="88" height="20" rx="10" fill="#fbfaff"/>
  <text x="280" y="270" text-anchor="middle" class="lbl">request ↑ update ↓</text>
  <rect x="456" y="256" width="94" height="20" rx="10" fill="#fbfaff"/>
  <text x="458" y="270" class="lbl">same messages</text>
  <rect x="706" y="256" width="122" height="20" rx="10" fill="#fbfaff"/>
  <text x="712" y="270" class="lbl">act / screen ↓ results ↑</text>
  <text x="120" y="290" class="lbl">audio</text>
  <text x="372" y="476" class="lbl">copy of every frame</text>
  <text x="612" y="476" class="lbl">call / call_result</text>
  <text x="548" y="298" text-anchor="middle" class="lbl" style="font-style:italic">WebSocket, one socket per role</text>
</svg>
