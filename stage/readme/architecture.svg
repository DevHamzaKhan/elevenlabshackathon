<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="t d">
  <title id="t">Bobby architecture</title>
  <desc id="d">One Expo app on an Android phone. The Mind, the Mouth and the Caller are WebSocket clients of a hub at ws://127.0.0.1:8765 inside the Hands package. Hands holds the accessibility service, the cursor overlay and the notification listener. The Mind calls the Anthropic API, the Mouth streams audio with ElevenLabs, and a laptop dashboard watches the hub through adb forward.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
      .h1 { font-size: 21px; font-weight: 700; }
      .sub { font-size: 13.5px; fill: #475569; }
      .cap { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; fill: #64748b; }
      .name { font-size: 16px; font-weight: 700; }
      .small { font-size: 12.5px; fill: #475569; }
      .msg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #1e293b; }
      .msgg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #64748b; }
      .flow { stroke: #334155; stroke-width: 1.8; fill: none; }
      .net { stroke: #94a3b8; stroke-width: 1.8; fill: none; }
      .plan { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <!-- own background so it reads on light and dark pages -->
  <rect x="0" y="0" width="1000" height="780" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="32" y="44" class="h1">How Bobby fits together</text>
  <text x="32" y="67" class="sub">Everything runs on the phone, in one Expo app. The parts talk through one WebSocket hub.</text>

  <!-- Cloud -->
  <rect x="32" y="84" width="660" height="100" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="48" y="103" class="cap">CLOUD (THE PHONE NEEDS INTERNET)</text>
  <rect x="56" y="112" width="176" height="58" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="144" y="136" class="name" text-anchor="middle">Anthropic API</text>
  <text x="144" y="156" class="small" text-anchor="middle">Claude Opus 5.5</text>
  <rect x="274" y="112" width="394" height="58" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="471" y="136" class="name" text-anchor="middle">ElevenLabs</text>
  <text x="471" y="156" class="small" text-anchor="middle">realtime voice agent · cloned-voice calls (planned)</text>

  <!-- Phone -->
  <rect x="32" y="212" width="660" height="548" rx="28" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="56" y="748" class="cap">ANDROID PHONE · ONE EXPO APP, "BOBBY"</text>

  <!-- Clients -->
  <rect x="56" y="236" width="176" height="100" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="72" y="262" class="name" fill="#6d28d9" style="fill:#6d28d9">Mind</text>
  <text x="72" y="283" class="small">TypeScript · Claude</text>
  <text x="72" y="301" class="small">plans, then drives one</text>
  <text x="72" y="319" class="small">step at a time</text>

  <rect x="274" y="236" width="176" height="100" rx="12" fill="#ffffff" stroke="#db2777" stroke-width="2"/>
  <text x="290" y="262" class="name" style="fill:#be185d">Mouth</text>
  <text x="290" y="283" class="small">TypeScript · ElevenLabs</text>
  <text x="290" y="301" class="small">Bobby's voice in your</text>
  <text x="290" y="319" class="small">earbuds. He only talks.</text>

  <rect x="492" y="236" width="176" height="100" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="508" y="262" class="name" style="fill:#c2410c">Caller</text>
  <text x="508" y="283" class="small">TypeScript · bobby-mouth</text>
  <text x="508" y="301" class="small">phones a friend in the</text>
  <text x="508" y="319" class="small">owner's voice (dry run)</text>

  <!-- Client to cloud -->
  <line x1="144" y1="234" x2="144" y2="172" class="net" marker-end="url(#ahg)" marker-start="url(#ahg)"/>
  <text x="152" y="202" class="msgg">HTTPS</text>
  <line x1="362" y1="234" x2="362" y2="172" class="net" marker-end="url(#ahg)" marker-start="url(#ahg)"/>
  <text x="370" y="202" class="msgg">audio (WebRTC)</text>
  <line x1="580" y1="234" x2="580" y2="172" class="net plan" marker-end="url(#ahg)" marker-start="url(#ahg)"/>
  <text x="588" y="202" class="msgg">call (planned)</text>

  <!-- Hands package -->
  <rect x="56" y="488" width="612" height="236" rx="16" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="72" y="510" class="cap" style="fill:#0f766e">HANDS · KOTLIN EXPO MODULE</text>
  <rect x="80" y="522" width="564" height="56" rx="10" fill="#0f766e"/>
  <text x="362" y="545" class="name" text-anchor="middle" style="fill:#ffffff">Hub · ws://127.0.0.1:8765</text>
  <text x="362" y="566" class="small" text-anchor="middle" style="fill:#ccfbf1">delivers each frame by its "to" field · copies every frame to watch clients</text>

  <rect x="80" y="640" width="168" height="70" rx="10" fill="#ffffff" stroke="#0d9488"/>
  <text x="94" y="664" class="name" style="font-size:14.5px">Accessibility service</text>
  <text x="94" y="684" class="small">reads the screen, taps,</text>
  <text x="94" y="700" class="small">types and swipes</text>

  <rect x="278" y="640" width="168" height="70" rx="10" fill="#ffffff" stroke="#0d9488"/>
  <text x="292" y="664" class="name" style="font-size:14.5px">Cursor overlay</text>
  <text x="292" y="684" class="small">glides to each target</text>
  <text x="292" y="700" class="small">before it is touched</text>

  <rect x="476" y="640" width="168" height="70" rx="10" fill="#ffffff" stroke="#0d9488"/>
  <text x="490" y="664" class="name" style="font-size:14.5px">Notification listener</text>
  <text x="490" y="684" class="small">forwards new</text>
  <text x="490" y="700" class="small">notifications</text>

  <!-- Clients to hub -->
  <line x1="84" y1="338" x2="84" y2="520" class="flow" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="98" y="384" class="msg">↓ every request, with</text>
  <text x="112" y="400" class="msg">to: hands, mouth,</text>
  <text x="112" y="416" class="msg">caller or watch</text>
  <text x="98" y="444" class="msg">↑ every reply, heard</text>
  <text x="112" y="460" class="msg">and notification</text>

  <line x1="302" y1="338" x2="302" y2="520" class="flow" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="316" y="384" class="msg">↓ say · whisper</text>
  <text x="330" y="400" class="msg">correct · hush · sleep</text>
  <text x="316" y="428" class="msg">↑ wake · heard · spoke</text>
  <text x="330" y="444" class="msg">say_started · say_done</text>
  <text x="330" y="460" class="msg">asleep</text>

  <line x1="520" y1="338" x2="520" y2="520" class="flow" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="534" y="384" class="msg">↓ call</text>
  <text x="534" y="412" class="msg">↑ call_status</text>
  <text x="548" y="428" class="msg">call_result</text>

  <!-- Hub to native pieces -->
  <line x1="104" y1="580" x2="104" y2="638" class="flow" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="116" y="598" class="msg">↓ screen · act</text>
  <text x="116" y="613" class="msg">↑ screen_result</text>
  <text x="130" y="628" class="msg">act_result</text>
  <line x1="302" y1="580" x2="302" y2="638" class="flow" marker-end="url(#ah)"/>
  <text x="314" y="612" class="msg">↓ cursor (show / hide)</text>
  <line x1="500" y1="580" x2="500" y2="638" class="flow" marker-start="url(#ah)"/>
  <text x="512" y="612" class="msg">↑ notification</text>

  <!-- Key -->
  <rect x="724" y="84" width="252" height="216" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="742" y="108" class="cap">KEY</text>
  <line x1="742" y1="130" x2="786" y2="130" class="flow" marker-end="url(#ah)"/>
  <text x="796" y="134" class="small">frame through the hub</text>
  <line x1="742" y1="156" x2="786" y2="156" class="net" marker-end="url(#ahg)"/>
  <text x="796" y="160" class="small">internet</text>
  <line x1="742" y1="182" x2="786" y2="182" class="net plan" marker-end="url(#ahg)"/>
  <text x="796" y="186" class="small">planned, not built yet</text>
  <text x="742" y="216" class="small">Mind, Mouth and Caller each open</text>
  <text x="742" y="233" class="small">their own socket to the hub, so</text>
  <text x="742" y="250" class="small">each part can be tested alone.</text>
  <text x="742" y="276" class="small">Only the Mind starts or cancels</text>
  <text x="742" y="293" class="small">a task.</text>

  <!-- Laptop -->
  <rect x="724" y="488" width="252" height="236" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="742" y="510" class="cap" style="fill:#1d4ed8">LAPTOP · DEMO SCREEN</text>
  <rect x="744" y="518" width="212" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="760" y="542" class="name" style="fill:#1d4ed8">Dashboard</text>
  <text x="760" y="561" class="small">Stage · index.html</text>
  <text x="760" y="578" class="small">read-only watch client</text>
  <line x1="646" y1="550" x2="742" y2="550" class="flow" marker-end="url(#ah)"/>
  <text x="742" y="614" class="small">Gets peers, a wire copy of</text>
  <text x="742" y="631" class="small">every frame, and the Mind's</text>
  <text x="742" y="648" class="small">task, plan and step.</text>
  <text x="742" y="676" class="small">Over USB, after</text>
  <text x="742" y="696" class="msg">adb forward tcp:8765 tcp:8765</text>
</svg>
