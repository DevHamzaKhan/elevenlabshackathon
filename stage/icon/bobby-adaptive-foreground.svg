<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Bobby adaptive-icon foreground (transparent; background colour #5B3FE0). Matches the "ring" cursor (stage/cursor/ring). Content stays inside the
       central 66% circle so Android's adaptive-icon masks never clip it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A6CFF"/>
      <stop offset="1" stop-color="#3A1FB8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Voice arcs, left and right of the ring: Bobby talks while the cursor works. -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-opacity="0.85">
    <path d="M286 410 A150 150 0 0 0 286 610" stroke-width="30"/>
    <path d="M226 360 A220 220 0 0 0 226 660" stroke-width="26" stroke-opacity="0.5"/>
    <path d="M738 410 A150 150 0 0 1 738 610" stroke-width="30"/>
    <path d="M798 360 A220 220 0 0 1 798 660" stroke-width="26" stroke-opacity="0.5"/>
  </g>
  <!-- The ring cursor, scaled up: shadow, tinted fill, white ring, violet ring, centre dot. -->
  <circle cx="512" cy="522" r="170" fill="none" stroke="#000000" stroke-opacity="0.22" stroke-width="70"/>
  <circle cx="512" cy="510" r="170" fill="#FFFFFF" fill-opacity="0.16"/>
  <circle cx="512" cy="510" r="170" fill="none" stroke="#FFFFFF" stroke-width="62"/>
  <circle cx="512" cy="510" r="170" fill="none" stroke="#7C5CFF" stroke-width="30"/>
  <circle cx="512" cy="518" r="44" fill="#000000" fill-opacity="0.25"/>
  <circle cx="512" cy="510" r="42" fill="#FFFFFF"/>
  <circle cx="512" cy="510" r="26" fill="#4B2FD6"/>
</svg>
