[project]
name = "caller"
version = "0.1.0"
description = "Bobby Caller: places outbound phone calls for the Orchestrator via ElevenLabs Agents + Twilio"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
caller = "caller.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caller"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
